<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign In or Register for WorkBridge - Intelligent Milestone &amp; Scope Collaboration Platform">
    <title>Authentication | WorkBridge</title>
    
    <!-- CSS Foundations -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="auth-body">

    <!-- Minimal Header -->
    <header class="auth-header">
        <div class="container auth-nav-container">
            <a href="index.html" class="brand-logo">
                <span class="logo-accent">Work</span>Bridge
            </a>
            <a href="index.html" class="text-link">&larr; Back to Home</a>
        </div>
    </header>

    <!-- Main Auth Card Container -->
    <main class="auth-main">
        <div class="auth-card">
            
            <!-- Auth Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tabLogin" class="auth-tab active" role="tab" aria-selected="true">
                    Sign In
                </button>
                <button type="button" id="tabRegister" class="auth-tab" role="tab" aria-selected="false">
                    Register
                </button>
            </div>

            <!-- Dynamic Feedback Alert Box -->
            <div id="authAlert" class="alert alert-hidden mt-3" role="alert"></div>

            <!-- ===================== LOGIN FORM ===================== -->
            <form id="loginForm" class="auth-form mt-3" novalidate>
                <div class="form-group">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="email" 
                        class="form-control" 
                        placeholder="name@company.com" 
                        autocomplete="username"
                        required
                    >
                    <span class="form-error" id="loginEmailError"></span>
                </div>

                <div class="form-group mt-2">
                    <div class="form-label-row">
                        <label for="loginPassword" class="form-label">Password</label>
                    </div>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        autocomplete="current-password"
                        required
                    >
                    <span class="form-error" id="loginPasswordError"></span>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block mt-3">
                    <span class="btn-text">Sign In to Workspace</span>
                </button>
            </form>

            <!-- ===================== REGISTER FORM ===================== -->
            <form id="registerForm" class="auth-form form-hidden mt-3" novalidate>
                
                <!-- Role Selection -->
                <div class="form-group">
                    <label class="form-label">Account Type *</label>
                    <div class="role-selector-grid">
                        <label class="role-option">
                            <input type="radio" name="role" value="CLIENT" id="roleClientRadio" checked>
                            <div class="role-box">
                                <span class="role-title">Client</span>
                                <span class="role-desc">Commission work &amp; lock project scopes</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="SERVICE_PROVIDER" id="roleProviderRadio">
                            <div class="role-box">
                                <span class="role-title">Service Provider</span>
                                <span class="role-desc">Deliver technical solutions &amp; milestones</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group mt-2">
                    <label for="regFullName" class="form-label">Full Name / Organization Name *</label>
                    <input 
                        type="text" 
                        id="regFullName" 
                        name="fullName" 
                        class="form-control" 
                        placeholder="e.g. Alex Johnson or Apex Solutions" 
                        autocomplete="name"
                        required
                    >
                    <span class="form-error" id="regFullNameError"></span>
                </div>

                <div class="form-group mt-2">
                    <label for="regEmail" class="form-label">Email Address *</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        name="email" 
                        class="form-control" 
                        placeholder="name@company.com" 
                        autocomplete="email"
                        required
                    >
                    <span class="form-error" id="regEmailError"></span>
                </div>

                <!-- Provider Domain Specialization (Auto toggled when Provider role is checked) -->
                <div class="form-group mt-2 hidden" id="providerDomainGroup">
                    <label for="regDomain" class="form-label">Primary Technical Specialization *</label>
                    <select id="regDomain" name="domain" class="form-control">
                        <option value="Full-Stack Web Development">Full-Stack Web Development</option>
                        <option value="Backend Engineering &amp; Cloud">Backend Engineering &amp; Cloud</option>
                        <option value="Frontend &amp; UI/UX Design">Frontend &amp; UI/UX Design</option>
                        <option value="Mobile App Development">Mobile App Development</option>
                        <option value="DevOps &amp; Infrastructure">DevOps &amp; Infrastructure</option>
                        <option value="AI &amp; Data Engineering">AI &amp; Data Engineering</option>
                    </select>
                </div>

                <div class="form-group mt-2">
                    <label for="regPassword" class="form-label">Password *</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        name="password" 
                        class="form-control" 
                        placeholder="Minimum 6 characters" 
                        autocomplete="new-password"
                        required
                    >
                    <span class="form-error" id="regPasswordError"></span>
                </div>

                <div class="form-group mt-2">
                    <label for="regConfirmPassword" class="form-label">Confirm Password *</label>
                    <input 
                        type="password" 
                        id="regConfirmPassword" 
                        name="confirmPassword" 
                        class="form-control" 
                        placeholder="Re-enter password" 
                        autocomplete="new-password"
                        required
                    >
                    <span class="form-error" id="regConfirmPasswordError"></span>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block mt-3">
                    <span class="btn-text">Create Account</span>
                </button>
            </form>

        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Scripts Pipeline (Supabase Loaded FIRST before Application Controllers) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api/supabaseClient.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state/authState.js"></script>
    <script src="js/api/apiClient.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/pages/authPage.js"></script>
</body>
</html>
