<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign In or Register for WorkBridge - Intelligent Collaboration Platform">
    <title>Authentication | WorkBridge</title>
    
    <!-- CSS Foundations -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="auth-body">

    <!-- Minimal Header -->
    <header class="auth-header">
        <div class="container auth-nav-container">
            <a href="index.html" class="brand-logo">
                <span class="logo-accent">Work</span>Bridge
            </a>
            <a href="index.html" class="text-link">&larr; Back to Home</a>
        </div>
    </header>

    <!-- Main Auth Card Container -->
    <main class="auth-main">
        <div class="auth-card">
            
            <!-- Auth Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tabLogin" class="auth-tab active" role="tab" aria-selected="true">
                    Sign In
                </button>
                <button type="button" id="tabRegister" class="auth-tab" role="tab" aria-selected="false">
                    Register
                </button>
            </div>

            <!-- Dynamic Feedback / Toast Area -->
            <div id="authAlert" class="alert alert-hidden" role="alert"></div>

            <!-- ===================== LOGIN FORM ===================== -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="email" 
                        class="form-control" 
                        placeholder="you@company.com" 
                        required 
                        autocomplete="email"
                    >
                    <span class="form-error" id="loginEmailError"></span>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="loginPassword" class="form-label">Password</label>
                    </div>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        class="form-control" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <span class="form-error" id="loginPasswordError"></span>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
                    Sign In to Workspace
                </button>
            </form>

            <!-- ===================== REGISTER FORM ===================== -->
            <form id="registerForm" class="auth-form form-hidden" novalidate>
                
                <!-- Role Selection -->
                <div class="form-group">
                    <label class="form-label">I want to join as a:</label>
                    <div class="role-selector-grid">
                        <label class="role-option">
                            <input type="radio" name="role" value="CLIENT" checked>
                            <div class="role-box">
                                <span class="role-title">Client</span>
                                <span class="role-desc">Hire providers & manage project requirements</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="SERVICE_PROVIDER">
                            <div class="role-box">
                                <span class="role-title">Service Provider</span>
                                <span class="role-desc">Offer technical services & collaborate on deliverables</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regFullName" class="form-label">Full Name / Organization Name</label>
                    <input 
                        type="text" 
                        id="regFullName" 
                        name="fullName" 
                        class="form-control" 
                        placeholder="Alex Johnson or TechNova Labs" 
                        required
                    >
                    <span class="form-error" id="regFullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="regEmail" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        name="email" 
                        class="form-control" 
                        placeholder="you@company.com" 
                        required 
                        autocomplete="email"
                    >
                    <span class="form-error" id="regEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="regPassword" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        name="password" 
                        class="form-control" 
                        placeholder="Minimum 8 characters" 
                        required 
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <span class="form-error" id="regPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                    <input 
                        type="password" 
                        id="regConfirmPassword" 
                        name="confirmPassword" 
                        class="form-control" 
                        placeholder="Re-enter your password" 
                        required 
                        autocomplete="new-password"
                    >
                    <span class="form-error" id="regConfirmPasswordError"></span>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>

        </div>
    </main>

    <!-- Shared Utilities and Page Script -->
    <script src="js/config.js"></script>
    <script src="js/state/authState.js"></script>
    <script src="js/api/apiClient.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/pages/authPage.js"></script>
</body>
</html>
